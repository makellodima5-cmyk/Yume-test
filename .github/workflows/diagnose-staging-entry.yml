name: Diagnose staging Worker entrypoint

on:
  push:
    branches:
      - diagnose/worker-entrypoint

permissions:
  contents: read

jobs:
  build-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Inspect generated Worker entrypoint
        shell: bash
        run: |
          set -euo pipefail
          test -s .output/server/index.mjs
          echo "=== generated entry file ==="
          ls -lh .output/server/index.mjs
          echo "=== export declarations ==="
          grep -nE 'export default|export \{[^}]*default|fetch:' .output/server/index.mjs | head -40 || true
          echo "=== file ending ==="
          tail -c 2500 .output/server/index.mjs
          echo
          echo "=== Wrangler staging dry run ==="
          bunx wrangler deploy --dry-run --config wrangler.staging.jsonc
      - name: Upload generated server entry
        uses: actions/upload-artifact@v4
        with:
          name: yume-staging-server-entry
          path: .output/server/index.mjs
          if-no-files-found: error
          retention-days: 3
