name: Extract staging project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract archive into repository root
        run: |
          set -euo pipefail
          archive="-YUME-Website-staging-load-test.zip"
          test -f "$archive"
          mkdir -p /tmp/yume-staging
          unzip -q "$archive" -d /tmp/yume-staging
          source_dir="/tmp/yume-staging/-YUME-Website-staging-load-test"
          test -f "$source_dir/wrangler.staging.jsonc"
          test -f "$source_dir/wrangler.staging.queue.jsonc"
          cp -a "$source_dir/." .
          git status --short
      - name: Commit extracted project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract staging project from archive"
            git push
          else
            echo "No changes to commit"
          fi
